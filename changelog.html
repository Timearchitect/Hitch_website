<!DOCTYPE html>

    <script src="hamburger.js" defer></script>
    <link rel="stylesheet" href="style.css" />
    <script>
        window.onload = function () {
            fetch('public/changelog.md')
                .then(response => response.text())
                .then(data => {
                    var changelogElement = document.createElement('pre');
                    changelogElement.textContent = data;
                    document.getElementById('changelog').appendChild(changelogElement);
                });
        };
    </script>


    <title>Hitch App - Changelog</title>
</head>

<body>
    <main>

                <li nav-item><a href="about-us.html">Om oss</a></li>
                <li nav-item><a href="privacyPolicy.html">Integritetspolicy</a></li>
                <li nav-item><a href="contact-us.html">Kontakta Oss</a></li>
                <li nav-item><a href="changelog.html">ChangeLog</a></li>
            </ul>
            <div class="hamburger">

            </div>
        </nav>

        <section id="changelog">
            <h1>Welcome to Hitch App Changelog!</h1>
