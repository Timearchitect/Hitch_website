<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="navbar.js" defer></script>
    <link rel="stylesheet" href="style2.css" />
    <script src="script.js" defer></script>
    <link rel="icon" type="image/x-icon" href="res/favicon.png" />
    <title>Hitchapp - Kontakta oss</title>
</head>

<body>
    <main>
        <!-- Navbar placeholder -->
        <div id="navbar-placeholder"></div>

        <div class="containera">
            <h3>Om du vill komma i kontakt med oss eller har några frågor. Tveka inte att höra av er!</h3>

            <br>
            <p> Till Jim:</p>
            <b><a href="mailto:jim@hitchapp.se">jim@hitchapp.se</a></b>
            <br>
            <br>
            <p>Till teamet:</p>
            <b><a href="mailto:info@hitchapp.se">info@hitchapp.se</a></b>
        </div>

    </main>
    <div id="footer-placeholder"></div>
    <script>
        // Function to load the footer
        function loadFooter() {
            fetch('footer.html')
                .then(response => response.text())
                .then(data => {
                    document.getElementById('footer-placeholder').innerHTML = data;
                });
        }

        // Function to handle cookie banner
        function handleCookieBanner() {
            if (!localStorage.getItem('cookiesAccepted')) {
                document.getElementById('cookie-banner').style.display = 'block';
            }
        }

        // Function to accept cookies
        function acceptCookies() {
            localStorage.setItem('cookiesAccepted', 'true');
            document.getElementById('cookie-banner').style.display = 'none';
        }

        // Load the footer and handle cookie banner when the DOM is fully loaded
        document.addEventListener('DOMContentLoaded', function () {
            loadFooter();
            handleCookieBanner();
        });
    </script>
</body>

</html>
